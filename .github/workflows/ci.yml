name: CI

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Lowercase and without the repo's trailing dot: image names can't end in ".".
  IMAGE: ghcr.io/bhusallaxman22/camera-dashboard
  # Keep in sync with backend/Dockerfile and Dockerfile.
  EXIFTOOL_VERSION: "13.59"
  YUNET_SHA256: 8f2383e4dd3cfbb4553ea8718107fc0423210dc964f9f4280604804ed2552fa4

jobs:
  backend:
    name: Backend (${{ matrix.database }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        database: [sqlite, postgres]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: z6iii
          POSTGRES_PASSWORD: z6iii
          POSTGRES_DB: z6iii_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U z6iii"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Cache ExifTool and face model
        id: tools
        uses: actions/cache@v4
        with:
          path: |
            ~/tools/exiftool
            ~/tools/models
          key: tools-exiftool-${{ env.EXIFTOOL_VERSION }}-yunet-${{ env.YUNET_SHA256 }}

      - name: Download ExifTool and face model
        if: steps.tools.outputs.cache-hit != 'true'
        working-directory: ${{ runner.temp }}
        run: |
          mkdir -p ~/tools/models
          curl -fsSL "https://github.com/exiftool/exiftool/archive/refs/tags/${EXIFTOOL_VERSION}.tar.gz" | tar -xz
          mv "exiftool-${EXIFTOOL_VERSION}" ~/tools/exiftool
          curl -fsSL -o ~/tools/models/face_detection_yunet_2023mar.onnx \
            "https://github.com/opencv/opencv_zoo/raw/main/models/face_detection_yunet/face_detection_yunet_2023mar.onnx"
          echo "${YUNET_SHA256}  $HOME/tools/models/face_detection_yunet_2023mar.onnx" | sha256sum -c -

      - name: Install ExifTool and face model
        run: |
          echo "$HOME/tools/exiftool" >> "$GITHUB_PATH"
          sudo mkdir -p /opt/models
          sudo cp ~/tools/models/face_detection_yunet_2023mar.onnx /opt/models/
          "$HOME/tools/exiftool/exiftool" -ver

      - name: Install Python dependencies
        run: pip install -r requirements-dev.txt

      - name: Ruff
        if: matrix.database == 'sqlite'
        run: |
          ruff check app tests
          ruff format --check app tests

      - name: Pytest
        env:
          TEST_DATABASE_URL: ${{ matrix.database == 'postgres' && 'postgresql+psycopg://z6iii:z6iii@localhost:5432/z6iii_test' || '' }}
        run: python -m pytest -q -rs

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  image:
    name: All-in-one image
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    permissions:
      contents: read
      packages: write
    env:
      PUBLISH: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: camera-dashboard:ci
          build-args: GIT_SHA=${{ github.sha }}
          cache-from: type=gha,scope=all-in-one
          cache-to: type=gha,mode=max,scope=all-in-one

      - name: Smoke test (Postgres + Redis + sample photos)
        run: |
          set -euo pipefail
          mkdir -p smoke/photos smoke/data
          docker run --rm --entrypoint python -v "$PWD/smoke/photos:/out" camera-dashboard:ci \
            -m app.cli generate-samples /out --count 6
          sudo find smoke/photos -type f -exec touch -d '5 minutes ago' {} +

          docker network create smoke
          docker run -d --name pg --network smoke \
            -e POSTGRES_USER=z6iii -e POSTGRES_PASSWORD=ci -e POSTGRES_DB=z6iii postgres:16
          docker run -d --name redis --network smoke redis:7
          docker run -d --name app --network smoke -p 8765:3000 -p 8766:8000 \
            -e DATABASE_URL=postgresql://z6iii:ci@pg:5432/z6iii \
            -e REDIS_URL=redis://redis:6379/0 \
            -v "$PWD/smoke/photos:/photos:ro" -v "$PWD/smoke/data:/data" \
            camera-dashboard:ci

          status=starting
          for _ in $(seq 1 60); do
            [ "$(docker inspect -f '{{.State.Running}}' app)" = true ] || { echo "container exited"; exit 1; }
            status="$(docker inspect -f '{{.State.Health.Status}}' app)"
            [ "$status" = healthy ] && break
            sleep 5
          done
          echo "health: $status"
          [ "$status" = healthy ]

          photos=0
          for _ in $(seq 1 45); do
            photos="$(curl -fsS http://localhost:8765/api/v1/stats | python3 -c 'import json,sys; print(json.load(sys.stdin)["totals"]["photos"])')"
            [ "$photos" -ge 6 ] && break
            sleep 2
          done
          echo "photos imported: $photos"
          [ "$photos" -ge 6 ]

          curl -fsS -o /dev/null http://localhost:8765/
          curl -fsS -o /dev/null http://localhost:8766/docs
          owner="$(stat -c %u:%g smoke/data/thumbnails)"
          echo "data owner: $owner"
          [ "$owner" = 568:568 ]

      - name: Container logs
        if: failure()
        run: docker logs app || true

      - name: Image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Log in to GHCR
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish
        if: env.PUBLISH == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: GIT_SHA=${{ github.sha }}
          cache-from: type=gha,scope=all-in-one

  docker:
    name: Docker images (source build)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    strategy:
      matrix:
        service: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.service }}
          push: false
          tags: z6iii-${{ matrix.service }}:ci
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

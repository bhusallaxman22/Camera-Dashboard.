name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Keep in sync with backend/Dockerfile.
  EXIFTOOL_VERSION: "13.59"
  YUNET_SHA256: 8f2383e4dd3cfbb4553ea8718107fc0423210dc964f9f4280604804ed2552fa4

jobs:
  backend:
    name: Backend (${{ matrix.database }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        database: [sqlite, postgres]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: z6iii
          POSTGRES_PASSWORD: z6iii
          POSTGRES_DB: z6iii_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U z6iii"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Cache ExifTool and face model
        id: tools
        uses: actions/cache@v4
        with:
          path: |
            ~/tools/exiftool
            ~/tools/models
          key: tools-exiftool-${{ env.EXIFTOOL_VERSION }}-yunet-${{ env.YUNET_SHA256 }}

      - name: Download ExifTool and face model
        if: steps.tools.outputs.cache-hit != 'true'
        working-directory: ${{ runner.temp }}
        run: |
          mkdir -p ~/tools/models
          curl -fsSL "https://github.com/exiftool/exiftool/archive/refs/tags/${EXIFTOOL_VERSION}.tar.gz" | tar -xz
          mv "exiftool-${EXIFTOOL_VERSION}" ~/tools/exiftool
          curl -fsSL -o ~/tools/models/face_detection_yunet_2023mar.onnx \
            "https://github.com/opencv/opencv_zoo/raw/main/models/face_detection_yunet/face_detection_yunet_2023mar.onnx"
          echo "${YUNET_SHA256}  $HOME/tools/models/face_detection_yunet_2023mar.onnx" | sha256sum -c -

      - name: Install ExifTool and face model
        run: |
          echo "$HOME/tools/exiftool" >> "$GITHUB_PATH"
          sudo mkdir -p /opt/models
          sudo cp ~/tools/models/face_detection_yunet_2023mar.onnx /opt/models/
          "$HOME/tools/exiftool/exiftool" -ver

      - name: Install Python dependencies
        run: pip install -r requirements-dev.txt

      - name: Ruff
        if: matrix.database == 'sqlite'
        run: |
          ruff check app tests
          ruff format --check app tests

      - name: Pytest
        env:
          TEST_DATABASE_URL: ${{ matrix.database == 'postgres' && 'postgresql+psycopg://z6iii:z6iii@localhost:5432/z6iii_test' || '' }}
        run: python -m pytest -q -rs

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  docker:
    name: Docker images
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    strategy:
      matrix:
        service: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.service }}
          push: false
          tags: z6iii-${{ matrix.service }}:ci
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
